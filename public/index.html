<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра - GARAGE</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <div class="game-container">
        <!-- ВИДЕО КОНТЕЙНЕР В ВЕРХУ -->
        <div class="video-container">
            <div class="video-box">
                <div class="video-placeholder" id="video-master">
                    <i class="fas fa-user-tie"></i>
                    <p>Ведущий</p>
                </div>
            </div>
            <div class="video-box">
                <div class="video-placeholder" id="video-team1">
                    <i class="fas fa-user"></i>
                    <p>Команда 1</p>
                    <div class="current-turn-indicator" id="turn-indicator-1">ХОД</div>
                </div>
            </div>
            <div class="video-box">
                <div class="video-placeholder" id="video-team2">
                    <i class="fas fa-user"></i>
                    <p>Команда 2</p>
                    <div class="current-turn-indicator" id="turn-indicator-2">ХОД</div>
                </div>
            </div>
        </div>

        <!-- Верхняя панель с информацией -->
        <div class="top-panel">
            <div class="score-board">
                <div class="team-score" id="team1-score">
                    <h3 id="team1-name">Команда 1</h3>
                    <div class="score">0</div>
                </div>
                <div class="dice-container">
                    <div class="dice" id="dice">?</div>
                    <button id="roll-dice" class="btn">Бросить кубик</button>
                    <div id="task-type"></div>
                </div>
                <div class="team-score" id="team2-score">
                    <h3 id="team2-name">Команда 2</h3>
                    <div class="score">0</div>
                </div>
            </div>
            
            <div class="timer-container">
                <div id="timer">60</div>
                <div class="timer-label">секунд</div>
            </div>
        </div>

        <!-- Основное игровое поле -->
        <div class="main-game-area">
            <!-- Колоды карт слева -->
            <div class="decks-left">
                <div class="deck" id="kitchen-deck" data-type="1">
                    <div class="deck-label">Кухня</div>
                </div>
                <div class="deck" id="bar-deck" data-type="2">
                    <div class="deck-label">Бар</div>
                </div>
                <div class="deck" id="knowledge-deck" data-type="3">
                    <div class="deck-label">Знания</div>
                </div>
            </div>

            <!-- Игровое поле -->
            <div class="game-board">
                <canvas id="board-canvas"></canvas>
                <div class="pieces">
                    <div class="piece" id="piece1" data-team="1"></div>
                    <div class="piece" id="piece2" data-team="2"></div>
                </div>
                <div id="cells-container">
                    <!-- Клетки будут сгенерированы через JS -->
                </div>
            </div>

            <!-- Колоды карт справа -->
            <div class="decks-right">
                <div class="deck" id="situation-deck" data-type="4">
                    <div class="deck-label">Ситуация</div>
                </div>
                <div class="deck" id="service-deck" data-type="5">
                    <div class="deck-label">Сервис</div>
                </div>
                <div class="deck" id="sales-deck" data-type="6">
                    <div class="deck-label">Продажи</div>
                </div>
            </div>
        </div>

        <!-- Центральная карточка с вопросом -->
        <div class="card-modal" id="card-modal">
            <div class="card-content">
                <div class="card-front">
                    <div class="dice-icon" id="card-dice"></div>
                </div>
                <div class="card-back">
                    <h3 id="card-category"></h3>
                    <p id="card-question"></p>
                    <div class="card-instruction" id="card-instruction"></div>
                    <!-- Кнопка для отвечающего игрока -->
                    <button id="answer-received" class="btn answer-btn" style="display: none;">
                        <i class="fas fa-check-circle"></i> Завершить ответ
                    </button>
                    <!-- Кнопка для ведущего -->
                    <button id="master-evaluation" class="btn evaluation-btn" style="display: none; background: #FF9800;">
                        <i class="fas fa-clipboard-check"></i> Приступить к оцениванию
                    </button>
                </div>
            </div>
        </div>

        <!-- Компактная панель ведущего -->
<div class="master-panel" id="master-panel">
    <div class="master-panel-header">
        <h3><i class="fas fa-crown"></i> Панель ведущего</h3>
        <button class="close-panel" id="close-panel">&times;</button>
    </div>
    
    <div class="compact-controls">
        <div class="team-control-row">
            <div class="team-label" style="color: #2196F3;">
                <i class="fas fa-user-circle"></i>
                <span id="master-team1-name">Команда 1</span>
            </div>
            <div class="points-control-compact">
                <div class="points-buttons-row">
                    <button class="point-btn compact plus-btn" data-points="1" data-team="1" title="+1 очко">+1</button>
                    <button class="point-btn compact plus-btn" data-points="2" data-team="1" title="+2 очка">+2</button>
                    <button class="point-btn compact plus-btn" data-points="3" data-team="1" title="+3 очка">+3</button>
                    <span class="points-separator"></span>
                    <button class="point-btn compact minus-btn" data-points="-1" data-team="1" title="-1 очко">-1</button>
                    <button class="point-btn compact minus-btn" data-points="-2" data-team="1" title="-2 очка">-2</button>
                    <button class="point-btn compact minus-btn" data-points="-3" data-team="1" title="-3 очка">-3</button>
                </div>
                <div class="current-selection-compact" id="team1-selection">
                    <span class="selection-label">Выбрано:</span>
                    <span class="selection-value">0</span>
                </div>
            </div>
        </div>
        
        <div class="team-control-row">
            <div class="team-label" style="color: #FF5722;">
                <i class="fas fa-user-circle"></i>
                <span id="master-team2-name">Команда 2</span>
            </div>
            <div class="points-control-compact">
                <div class="points-buttons-row">
                    <button class="point-btn compact plus-btn" data-points="1" data-team="2" title="+1 очко">+1</button>
                    <button class="point-btn compact plus-btn" data-points="2" data-team="2" title="+2 очка">+2</button>
                    <button class="point-btn compact plus-btn" data-points="3" data-team="2" title="+3 очка">+3</button>
                    <span class="points-separator"></span>
                    <button class="point-btn compact minus-btn" data-points="-1" data-team="2" title="-1 очко">-1</button>
                    <button class="point-btn compact minus-btn" data-points="-2" data-team="2" title="-2 очка">-2</button>
                    <button class="point-btn compact minus-btn" data-points="-3" data-team="2" title="-3 очка">-3</button>
                </div>
                <div class="current-selection-compact" id="team2-selection">
                    <span class="selection-label">Выбрано:</span>
                    <span class="selection-value">0</span>
                </div>
            </div>
        </div>
    </div>
    
    <div class="master-action-row">
        <button id="next-turn" class="btn next-turn-btn">
            <i class="fas fa-arrow-right"></i> Перейти к следующему ходу
        </button>
    </div>
</div>

        <!-- Салюты при победе -->
        <div id="fireworks"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
