<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GARAGE - ресторанная игра</title>
    
    <!-- Font Awesome 6 (иконки) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Socket.IO client -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <!-- Основные стили игры -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Дополнительные стили для анимаций и адаптивности -->
    <style>
        /* Глобальные исправления */
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            color: white;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
        }
        
        .game-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            transition: opacity 0.5s;
        }
        
        /* Анимации для салюта */
        @keyframes firework {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            50% { transform: translateY(-100px) scale(1.5); opacity: 0.8; }
            100% { transform: translateY(-200px) scale(2); opacity: 0; }
        }
        
        @keyframes slideDown {
            from { transform: translateX(-50%) translateY(-20px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
        
        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(0); opacity: 1; }
            to { transform: translateX(-50%) translateY(-20px); opacity: 0; }
        }
        
        @keyframes modalSlideIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        
        @keyframes modalSlideOut {
            from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            to { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
        }
        
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        
        /* Скрытые элементы */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- ========== ВИДЕО КОНТЕЙНЕРЫ (3 шт) ========== -->
        <div class="video-container">
            <div class="video-box" id="video-master-container">
                <div class="video-placeholder">
                    <i class="fas fa-user-tie"></i>
                    <p>Ведущий</p>
                </div>
            </div>
            <div class="video-box" id="video-team1-container">
                <div class="video-placeholder">
                    <i class="fas fa-user"></i>
                    <p>Команда 1</p>
                    <div class="current-turn-indicator" id="turn-indicator-1">ХОД</div>
                </div>
            </div>
            <div class="video-box" id="video-team2-container">
                <div class="video-placeholder">
                    <i class="fas fa-user"></i>
                    <p>Команда 2</p>
                    <div class="current-turn-indicator" id="turn-indicator-2">ХОД</div>
                </div>
            </div>
        </div>

        <!-- ========== ВЕРХНЯЯ ПАНЕЛЬ ========== -->
        <div class="top-panel">
            <!-- Информация о подключении -->
            <div class="connection-info horizontal">
                <div class="connection-status connected">
                    <i class="fas fa-circle"></i>
                    <span>Подключено</span>
                </div>
                <div class="room-info">
                    <i class="fas fa-door-closed"></i>
                    <span>Комната: Нет</span>
                </div>
                <div class="player-info">
                    <i class="fas fa-user"></i>
                    <span>Игрок (Не выбран)</span>
                </div>
            </div>
            
            <!-- Счет и кубик -->
            <div class="score-board">
                <div class="team-score" id="team1-score">
                    <h3 id="team1-name">Команда 1</h3>
                    <div class="score">0</div>
                </div>
                <div class="dice-container">
                    <div class="dice" id="dice">?</div>
                    <button id="roll-dice" class="btn">
                        <i class="fas fa-dice"></i> Бросить кубик
                    </button>
                    <div id="task-type"></div>
                </div>
                <div class="team-score" id="team2-score">
                    <h3 id="team2-name">Команда 2</h3>
                    <div class="score">0</div>
                </div>
            </div>
            
            <!-- Таймер -->
            <div class="timer-container">
                <div id="timer">60</div>
                <div class="timer-label">секунд</div>
            </div>
        </div>

        <!-- ========== ИГРОВОЕ ПОЛЕ ========== -->
        <div class="main-game-area">
            <!-- Левая колода карт (категории 1-3) -->
            <div class="decks-left">
                <div class="deck" id="kitchen-deck" data-type="1" aria-label="Кухня">
                    <img src="cards/1.png" alt="Кухня" class="deck-image">
                    <span class="sr-only">Кухня</span>
                </div>
                <div class="deck" id="bar-deck" data-type="2" aria-label="Бар">
                    <img src="cards/2.png" alt="Бар" class="deck-image">
                    <span class="sr-only">Бар</span>
                </div>
                <div class="deck" id="knowledge-deck" data-type="3" aria-label="Знания">
                    <img src="cards/3.png" alt="Знания" class="deck-image">
                    <span class="sr-only">Знания</span>
                </div>
            </div>

            <!-- Игровая доска с canvas и фишками -->
            <div class="game-board">
                <canvas id="board-canvas"></canvas>
                <div class="pieces">
                    <div class="piece" id="piece1" data-team="1"></div>
                    <div class="piece" id="piece2" data-team="2"></div>
                </div>
                <div id="cells-container"></div>
            </div>

            <!-- Правая колода карт (категории 4-6) -->
            <div class="decks-right">
                <div class="deck" id="situation-deck" data-type="4" aria-label="Ситуация">
                    <img src="cards/4.png" alt="Ситуация" class="deck-image">
                    <span class="sr-only">Ситуация</span>
                </div>
                <div class="deck" id="service-deck" data-type="5" aria-label="Сервис">
                    <img src="cards/5.png" alt="Сервис" class="deck-image">
                    <span class="sr-only">Сервис</span>
                </div>
                <div class="deck" id="sales-deck" data-type="6" aria-label="Продажи">
                    <img src="cards/6.png" alt="Продажи" class="deck-image">
                    <span class="sr-only">Продажи</span>
                </div>
            </div>
        </div>

        <!-- ========== КАРТОЧКА С ВОПРОСОМ (модальное окно) ========== -->
        <div class="card-modal" id="card-modal">
            <div class="card-content">
                <div class="card-front">
                    <div class="dice-icon" id="card-dice"></div>
                </div>
                <div class="card-back">
                    <h3 id="card-category"></h3>
                    <p id="card-question"></p>
                    <div class="card-instruction" id="card-instruction"></div>
                    <button id="answer-received" class="btn answer-btn" style="display: none;">
                        <i class="fas fa-check-circle"></i> Завершить ответ
                    </button>
                    <button id="master-evaluation" class="btn evaluation-btn" style="display: none;">
                        <i class="fas fa-clipboard-check"></i> Приступить к оцениванию
                    </button>
                </div>
            </div>
        </div>

        <!-- ========== ПАНЕЛЬ ВЕДУЩЕГО ========== -->
        <div class="master-panel" id="master-panel">
            <div class="master-panel-header">
                <h3><i class="fas fa-crown"></i> Панель ведущего</h3>
            </div>
            
            <div class="compact-controls">
                <!-- Команда 1 -->
                <div class="team-control-row" id="team-control-row-1">
                    <div class="team-label" style="color: #2196F3;">
                        <i class="fas fa-user-circle"></i>
                        <span id="master-team1-name">Команда 1: Ожидает</span>
                    </div>
                    <div class="points-control-compact">
                        <div class="points-buttons-row">
                            <button class="point-btn compact plus-btn" data-points="1" data-team="1" title="+1 очко">+1</button>
                            <button class="point-btn compact plus-btn" data-points="2" data-team="1" title="+2 очка">+2</button>
                            <button class="point-btn compact plus-btn" data-points="3" data-team="1" title="+3 очка">+3</button>
                            <span class="points-separator"></span>
                            <button class="point-btn compact minus-btn" data-points="-1" data-team="1" title="-1 очко">-1</button>
                            <button class="point-btn compact minus-btn" data-points="-2" data-team="1" title="-2 очка">-2</button>
                            <button class="point-btn compact minus-btn" data-points="-3" data-team="1" title="-3 очка">-3</button>
                        </div>
                        <div class="current-selection-compact" id="team1-selection">
                            <span class="selection-label">Выбрано:</span>
                            <span class="selection-value">0</span>
                        </div>
                    </div>
                </div>
                
                <!-- Команда 2 -->
                <div class="team-control-row" id="team-control-row-2">
                    <div class="team-label" style="color: #FF5722;">
                        <i class="fas fa-user-circle"></i>
                        <span id="master-team2-name">Команда 2: Ожидает</span>
                    </div>
                    <div class="points-control-compact">
                        <div class="points-buttons-row">
                            <button class="point-btn compact plus-btn" data-points="1" data-team="2" title="+1 очко">+1</button>
                            <button class="point-btn compact plus-btn" data-points="2" data-team="2" title="+2 очка">+2</button>
                            <button class="point-btn compact plus-btn" data-points="3" data-team="2" title="+3 очка">+3</button>
                            <span class="points-separator"></span>
                            <button class="point-btn compact minus-btn" data-points="-1" data-team="2" title="-1 очко">-1</button>
                            <button class="point-btn compact minus-btn" data-points="-2" data-team="2" title="-2 очка">-2</button>
                            <button class="point-btn compact minus-btn" data-points="-3" data-team="2" title="-3 очка">-3</button>
                        </div>
                        <div class="current-selection-compact" id="team2-selection">
                            <span class="selection-label">Выбрано:</span>
                            <span class="selection-value">0</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="master-action-row">
                <button id="next-turn" class="btn next-turn-btn">
                    <i class="fas fa-arrow-right"></i> Перейти к следующему ходу
                </button>
            </div>
        </div>

        <!-- ========== КОНТЕЙНЕР ДЛЯ ФЕЙЕРВЕРКОВ ========== -->
        <div id="fireworks"></div>
    </div>

    <!-- Основной скрипт игры (полный, с WebRTC через Socket.IO) -->
    <script src="script.js"></script>
</body>
</html>
